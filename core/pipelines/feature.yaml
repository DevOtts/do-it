pipeline: feature
version: 1
steps:
  - id: intake
    type: persona
    persona: intake
    tier: T3
  - id: prompt
    type: persona
    persona: intake
    skill: prompt-it
    consumes_previous: true
  - id: plan
    type: persona
    persona: planner
    skill: plan-it
    tier: T1
    ask: one batched readiness gate, planning ends only with READINESS.json
  - id: ratify
    type: decision
    gate: owner-gate
    ask: approve the plan and its recorded defaults
    needs: [plan]
  - id: build
    type: persona
    persona: builder
    skill: build-it
    needs: [ratify]
  - id: verify
    type: persona
    persona: verifier
    consumes_previous: true
  - id: review
    type: persona
    persona: reviewer
    skill: review-it
    loop_to: build
    max_rounds: 3
    on_limit: review-cap
  - id: deploy
    type: code
    persona: deployer
    adapter: deploy-it
    needs: [review]
  - id: prove
    type: persona
    persona: runner
    consumes_previous: true
  - id: conclude
    type: persona
    persona: concluder
    skill: conclude-it
