<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">do-it pipeline with failure loops and the spine underneath</title>
  <desc id="d">The lifecycle runs prompt-it, plan-it, build-it, review-it, deploy-it and conclude-it left to right. Dashed arrows show the failure loops: review back to build, deploy rolled back to build. The owner pack collects every question at the ratify gate. The spine bar underneath owns run state. The finish line closes the run when every row is terminal.</desc>
  <style>@keyframes pk{0%{transform:translate(115px,155px);opacity:0}4.286%{transform:translate(115px,155px);opacity:0}5.714%{transform:translate(115px,155px);opacity:1}9.643%{transform:translate(115px,155px);opacity:1}15%{transform:translate(285px,155px);opacity:1}19.643%{transform:translate(285px,155px);opacity:1}25%{transform:translate(455px,155px);opacity:1}29.643%{transform:translate(455px,155px);opacity:1}35%{transform:translate(625px,155px);opacity:1}39.643%{transform:translate(625px,155px);opacity:1}45%{transform:translate(795px,155px);opacity:1}49.643%{transform:translate(795px,155px);opacity:1}55%{transform:translate(965px,155px);opacity:1}62.143%{transform:translate(1065px,155px);opacity:1}65.714%{transform:translate(1065px,155px);opacity:0}100%{transform:translate(1065px,155px);opacity:0}}.pk{animation:pk 14s linear infinite}@keyframes lit_prompt{0%{fill:#10203a;stroke:#1e2d44}4.643%{fill:#10203a;stroke:#1e2d44}5%{fill:#0b3a52;stroke:#38bdf8}10.714%{fill:#0b3a52;stroke:#38bdf8}16.429%{fill:#10203a;stroke:#1e2d44}100%{fill:#10203a;stroke:#1e2d44}}.lit_prompt{animation:lit_prompt 14s linear infinite}@keyframes lit_plan{0%{fill:#10203a;stroke:#1e2d44}14.643%{fill:#10203a;stroke:#1e2d44}15%{fill:#0b3a52;stroke:#38bdf8}20.714%{fill:#0b3a52;stroke:#38bdf8}26.429%{fill:#10203a;stroke:#1e2d44}100%{fill:#10203a;stroke:#1e2d44}}.lit_plan{animation:lit_plan 14s linear infinite}@keyframes lit_build{0%{fill:#10203a;stroke:#1e2d44}24.643%{fill:#10203a;stroke:#1e2d44}25%{fill:#0b3a52;stroke:#38bdf8}30.714%{fill:#0b3a52;stroke:#38bdf8}36.429%{fill:#10203a;stroke:#1e2d44}100%{fill:#10203a;stroke:#1e2d44}}.lit_build{animation:lit_build 14s linear infinite}@keyframes lit_review{0%{fill:#10203a;stroke:#1e2d44}34.643%{fill:#10203a;stroke:#1e2d44}35%{fill:#0b3a52;stroke:#38bdf8}40.714%{fill:#0b3a52;stroke:#38bdf8}46.429%{fill:#10203a;stroke:#1e2d44}100%{fill:#10203a;stroke:#1e2d44}}.lit_review{animation:lit_review 14s linear infinite}@keyframes lit_deploy{0%{fill:#10203a;stroke:#1e2d44}44.643%{fill:#10203a;stroke:#1e2d44}45%{fill:#0b3a52;stroke:#38bdf8}50.714%{fill:#0b3a52;stroke:#38bdf8}56.429%{fill:#10203a;stroke:#1e2d44}100%{fill:#10203a;stroke:#1e2d44}}.lit_deploy{animation:lit_deploy 14s linear infinite}@keyframes lit_conclude{0%{fill:#10203a;stroke:#1e2d44}54.643%{fill:#10203a;stroke:#1e2d44}55%{fill:#06352b;stroke:#34d399}60.714%{fill:#06352b;stroke:#34d399}66.429%{fill:#10203a;stroke:#1e2d44}100%{fill:#10203a;stroke:#1e2d44}}.lit_conclude{animation:lit_conclude 14s linear infinite}@keyframes op{0%{fill:#2a2208}13.571%{fill:#2a2208}15.714%{fill:#5a4510}24.286%{fill:#2a2208}100%{fill:#2a2208}}.op{animation:op 14s linear infinite}@keyframes march{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-24}}.loop1,.loop2{animation:march 1.2s linear infinite}@keyframes spine{0%{fill:#0b3a52}6.429%{fill:#0b3a52}7.857%{fill:#0f5272}12.143%{fill:#0b3a52}16.429%{fill:#0b3a52}17.857%{fill:#0f5272}22.143%{fill:#0b3a52}26.429%{fill:#0b3a52}27.857%{fill:#0f5272}32.143%{fill:#0b3a52}36.429%{fill:#0b3a52}37.857%{fill:#0f5272}42.143%{fill:#0b3a52}46.429%{fill:#0b3a52}47.857%{fill:#0f5272}52.143%{fill:#0b3a52}56.429%{fill:#0b3a52}57.857%{fill:#0f5272}62.143%{fill:#0b3a52}100%{fill:#0b3a52}}.spine{animation:spine 14s linear infinite}@keyframes fin{0%{fill:#34d399;opacity:0.55}57.143%{fill:#34d399;opacity:0.55}60%{fill:#a7f3d0;opacity:1}77.143%{fill:#34d399;opacity:1}80.714%{fill:#34d399;opacity:0.55}100%{fill:#34d399;opacity:0.55}}.fin{animation:fin 14s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style>
  <rect x="1" y="1" width="1198" height="518" rx="18" fill="#0b1220" stroke="#1e2d44" stroke-width="2"/>
  <text x="50" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e8eefc">the pipeline</text>
  <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#e8eefc" text-anchor="middle">
    <rect class="lit_prompt" x="50" y="130" width="130" height="50" rx="10" fill="#10203a" stroke="#1e2d44"/><text x="115" y="161">prompt-it</text>
    <rect class="lit_plan" x="220" y="130" width="130" height="50" rx="10" fill="#10203a" stroke="#1e2d44"/><text x="285" y="161">plan-it</text>
    <rect class="lit_build" x="390" y="130" width="130" height="50" rx="10" fill="#10203a" stroke="#1e2d44"/><text x="455" y="161">build-it</text>
    <rect class="lit_review" x="560" y="130" width="130" height="50" rx="10" fill="#10203a" stroke="#1e2d44"/><text x="625" y="161">review-it</text>
    <rect class="lit_deploy" x="730" y="130" width="130" height="50" rx="10" fill="#10203a" stroke="#1e2d44"/><text x="795" y="161">deploy-it</text>
    <rect class="lit_conclude" x="900" y="130" width="130" height="50" rx="10" fill="#10203a" stroke="#1e2d44"/><text x="965" y="161">conclude-it</text>
  </g>
  <path d="M180 155 H220 M350 155 H390 M520 155 H560 M690 155 H730 M860 155 H900" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <!-- failure loops -->
  <path class="loop1" d="M625 180 V230 H455 V180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <text x="540" y="250" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#f59e0b">blockers and majors loop</text>
  <path class="loop2" d="M795 180 V280 H455 V180" stroke="#f87171" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
  <text x="640" y="300" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#f87171">rollback, fix, re-verify</text>
  <!-- owner pack at ratify -->
  <rect class="op" x="200" y="60" width="170" height="40" rx="8" fill="#2a2208" stroke="#fbbf24" stroke-width="2"/>
  <text x="285" y="85" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#fbbf24">owner pack</text>
  <path d="M285 100 V130" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <text x="400" y="85" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">every question, once, at the ratify gate</text>
  <!-- finish line -->
  <path d="M1065 110 V200" stroke="#34d399" stroke-width="3" fill="none"/>
  <path d="M1065 110 H1115 V140 H1065 M1065 140 H1115 V170 H1065 M1065 170 H1115 V200 H1065" stroke="#34d399" stroke-width="2" fill="none"/>
  <text class="fin" x="1090" y="228" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#34d399">finish line</text>
  <path d="M1030 155 H1065" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <!-- spine -->
  <rect class="spine" x="50" y="360" width="1000" height="56" rx="10" fill="#0b3a52" stroke="#38bdf8" stroke-width="2"/>
  <text x="550" y="386" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8eefc">the spine</text>
  <text x="550" y="406" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#7dd3fc">run state, evidence ledger, stop-gate, token meter, handoff: plain files under .do-it/</text>
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 4"><path d="M115 180 V360"/><path d="M285 180 V360"/><path d="M455 180 V360"/><path d="M625 180 V360"/><path d="M795 180 V360"/><path d="M965 180 V360"/></g>
  <text x="50" y="470" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">dashed amber and red: failure loops. Dotted blue: every stage reports to the spine and never writes run state itself.</text>
  <g class="pk"><circle r="9" fill="#38bdf8" opacity="0.25"/><circle r="5" fill="#e8eefc"/></g>
</svg>
