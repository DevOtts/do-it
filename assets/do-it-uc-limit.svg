<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-labelledby="t d">
  <title id="t">Use case: the usage limit hits mid-build</title>
  <desc id="d">An animation of a run that reaches the build slice and hits a usage limit. The build result reports usage_limit with exit code 3, the spine parks the run and writes park.json, the status in state.json becomes PARKED, time passes until the reset, then do-it resume lets a fresh conductor continue the same slice, through verify to conclude and DONE.</desc>
