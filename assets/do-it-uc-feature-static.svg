  <g class="ex0"><rect x="790" y="414" width="170" height="26" rx="13" fill="#06352b" stroke="#34d399"/><text x="875" y="432" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#34d399">DOD-1 VERIFIED</text></g>
  <rect x="980" y="414" width="170" height="26" rx="13" fill="#10203a" stroke="#1e2d44"/><text x="1065" y="432" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">DOD-2 OPEN</text>
  <g class="ex1"><rect x="980" y="414" width="170" height="26" rx="13" fill="#06352b" stroke="#34d399"/><text x="1065" y="432" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#34d399">DOD-2 VERIFIED</text></g>
  <rect x="790" y="444" width="170" height="26" rx="13" fill="#10203a" stroke="#1e2d44"/><text x="875" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">DOD-3 OPEN</text>
  <g class="ex2"><rect x="790" y="444" width="170" height="26" rx="13" fill="#06352b" stroke="#34d399"/><text x="875" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#34d399">DOD-3 VERIFIED</text></g>
  <rect x="980" y="444" width="170" height="26" rx="13" fill="#10203a" stroke="#1e2d44"/><text x="1065" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">DOD-4 OPEN</text>
  <g class="ex3"><rect x="980" y="444" width="170" height="26" rx="13" fill="#06352b" stroke="#34d399"/><text x="1065" y="462" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#34d399">DOD-4 VERIFIED</text></g>
  <text x="50" y="486" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5b6b85">measured on the overnight feature fixture, real Claude Code host: 442.5 input plus output tokens per VERIFIED row (T3 and cache excluded)</text>
  </svg>
