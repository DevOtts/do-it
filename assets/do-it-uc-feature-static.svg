  <text x="502.8" y="172" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#fbbf24">owner gate</text>
  <path d="M572.8 157 H623.2" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M621.2 152 L629.2 157 L621.2 162 Z" fill="#38bdf8"/>
  <path d="M697.2 108 V130" stroke="#1e2d44" stroke-width="2" fill="none"/>
  <rect class="nd lit_n3" x="633.2" y="130" width="128" height="54" rx="10" fill="#10203a" stroke="#1e2d44" stroke-width="2"/>
  <text x="697.2" y="154" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e8eefc">build slice</text>
  <text x="697.2" y="172" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#7dd3fc">T2</text>
  <path d="M767.2 157 H817.6" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M815.6 152 L823.6 157 L815.6 162 Z" fill="#38bdf8"/>
  <path d="M891.6 108 V130" stroke="#1e2d44" stroke-width="2" fill="none"/>
  <rect class="nd lit_n4" x="827.6" y="130" width="128" height="54" rx="10" fill="#10203a" stroke="#1e2d44" stroke-width="2"/>
  <text x="891.6" y="154" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e8eefc">verify</text>
  <text x="891.6" y="172" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#7dd3fc">T2</text>
