  <text x="50" y="240" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">plain files under .do-it/runs/&lt;run-id&gt;/</text>
  <g class="fc f0"><rect x="50" y="248" width="99" height="28" rx="14" fill="#0b1a2e" stroke="#38bdf8"/><text x="99.5" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">state.json</text></g>
  <g class="fc f1"><rect x="161" y="248" width="113.6" height="28" rx="14" fill="#0b1a2e" stroke="#38bdf8"/><text x="217.8" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">events.jsonl</text></g>
  <g class="fc f2"><rect x="286.6" y="248" width="150.1" height="28" rx="14" fill="#0b1a2e" stroke="#38bdf8"/><text x="361.65000000000003" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">token-meter.jsonl</text></g>
  <g class="fc f3"><rect x="448.70000000000005" y="248" width="186.6" height="28" rx="14" fill="#0b1a2e" stroke="#38bdf8"/><text x="542" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">results/ (it-result/1)</text></g>
  <g class="fc f4"><rect x="647.3000000000001" y="248" width="106.3" height="28" rx="14" fill="#0b1a2e" stroke="#34d399"/><text x="700.45" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">ledger.json</text></g>
  <rect x="50" y="298" width="710" height="166" rx="10" fill="#0a1626" stroke="#1e2d44"/>
  <text x="66" y="318" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5b6b85">what happens, in order</text>
  <text class="lg g0" x="66" y="344" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7dd3fc">&gt; "add slugify to the utils, tests must pass"</text>
  <text class="lg g1" x="66" y="365" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">planner T1 writes the plan; every decision resolved or defaulted</text>
  <text class="lg g2" x="66" y="386" font-family="Menlo, Consolas, monospace" font-size="13" fill="#fbbf24">ratify: you approve the plan and its recorded defaults</text>
  <text class="lg g3" x="66" y="407" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">builder T2 builds; its last act is an it-result/1 file</text>
  <text class="lg g4" x="66" y="428" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">spine record: DOD-1..DOD-4 VERIFIED, evidence/DOD-n.log</text>
  <text class="lg g5" x="66" y="449" font-family="Menlo, Consolas, monospace" font-size="13" fill="#34d399">stop-gate: 4 of 4 rows terminal, so the run may end</text>
  <rect x="790" y="298" width="360" height="46" rx="10" fill="#0a1626" stroke="#1e2d44"/>
  <text x="804" y="326" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">state.json status</text>
  <text class="st0" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">INTAKE</text>
  <text class="st1" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">PLANNING</text>
  <text class="st2" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#fbbf24" opacity="0">AWAIT_RATIFY</text>
  <text class="st3" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">BUILDING</text>
  <text class="st4" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">VERIFYING</text>
  <text class="st5" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">CONCLUDING</text>
  <text class="st6" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#34d399">DONE</text>
  <text x="790" y="368" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">token-meter.jsonl (one row per event)</text>
