  <text x="308.4" y="154" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e8eefc">plan</text>
  <text x="308.4" y="172" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#7dd3fc">T1</text>
  <path d="M378.4 157 H428.8" stroke="#38bdf8" stroke-width="2" fill="none"/><path d="M426.8 152 L434.8 157 L426.8 162 Z" fill="#38bdf8"/>
  <path d="M502.8 108 V130" stroke="#1e2d44" stroke-width="2" fill="none"/>
