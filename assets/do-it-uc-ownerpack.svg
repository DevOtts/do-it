;fill:#38bdf8}70.476%{transform:translate(600px,108px);opacity:1;fill:#38bdf8}73.095%{transform:translate(840px,108px);opacity:1;fill:#38bdf8}80.952%{transform:translate(840px,108px);opacity:1;fill:#38bdf8}83.571%{transform:translate(1080px,108px);opacity:1;fill:#38bdf8}90.476%{transform:translate(1080px,108px);opacity:1;fill:#38bdf8}93.333%{transform:translate(1080px,108px);opacity:0;fill:#34d399}100%{transform:translate(1080px,108px);opacity:0;fill:#34d399}}.pk{animation:pk 21s linear infinite}@keyframes bub{0%{opacity:1}40.714%{opacity:0}40.952%{opacity:1}100%{opacity:1}}.bub{animation:bub 21s linear infinite}@keyframes f0{0%{opacity:0}3.81%{opacity:0}6.19%{opacity:1}100%{opacity:1}}.f0{animation:f0 21s linear infinite}@keyframes f1{0%{opacity:0}4.762%{opacity:0}7.143%{opacity:1}100%{opacity:1}}.f1{animation:f1 21s linear infinite}@keyframes f2{0%{opacity:0}19.048%{opacity:0}21.429%{opacity:1}100%{opacity:1}}.f2{animation:f2 21s linear infinite}@keyframes f3{0%{opacity:0}20.952%{opacity:0}23.333%{opacity:1}100%{opacity:1}}.f3{animation:f3 21s linear infinite}@keyframes f4{0%{opacity:0}45.714%{opacity:0}48.095%{opacity:1}100%{opacity:1}}.f4{animation:f4 21s linear infinite}@keyframes g0{0%{opacity:0}4.762%{opacity:0}6.905%{opacity:1}100%{opacity:1}}.g0{animation:g0 21s linear infinite}@keyframes g1{0%{opacity:0}17.143%{opacity:0}19.286%{opacity:1}100%{opacity:1}}.g1{animation:g1 21s linear infinite}@keyframes g2{0%{opacity:0}22.857%{opacity:0}25%{opacity:1}100%{opacity:1}}.g2{animation:g2 21s linear infinite}@keyframes g3{0%{opacity:0}40.952%{opacity:0}43.095%{opacity:1}100%{opacity:1}}.g3{animation:g3 21s linear infinite}@keyframes g4{0%{opacity:0}45.714%{opacity:0}47.857%{opacity:1}100%{opacity:1}}.g4{animation:g4 21s linear infinite}@keyframes g5{0%{opacity:0}60%{opacity:0}62.143%{opacity:1}100%{opacity:1}}.g5{animation:g5 21s linear infinite}@keyframes st0{0%{opacity:0}4.524%{opacity:0}4.762%{opacity:1}16.905%{opacity:1}17.143%{opacity:0}100%{opacity:0}}.st0{a