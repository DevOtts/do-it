  <g class="fc f2"><rect x="323.1" y="248" width="135.5" height="28" rx="14" fill="#0b1a2e" stroke="#fbbf24"/><text x="390.85" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">owner-pack.json</text></g>
  <g class="fc f3"><rect x="470.6" y="248" width="179.29999999999998" height="28" rx="14" fill="#0b1a2e" stroke="#fbbf24"/><text x="560.25" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">owner-pack.md / .html</text></g>
  <g class="fc f4"><rect x="661.9" y="248" width="113.6" height="28" rx="14" fill="#0b1a2e" stroke="#34d399"/><text x="718.6999999999999" y="267" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#e8eefc">answers.json</text></g>
  <rect x="50" y="298" width="710" height="166" rx="10" fill="#0a1626" stroke="#1e2d44"/>
  <text x="66" y="318" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5b6b85">what happens, in order</text>
  <text class="lg g0" x="66" y="344" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">planner T1 writes READINESS.json: decisions resolved or defaulted</text>
  <text class="lg g1" x="66" y="365" font-family="Menlo, Consolas, monospace" font-size="13" fill="#fbbf24">the questions only you can answer go into one numbered pack</text>
  <text class="lg g2" x="66" y="386" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">shown as a native question, else HTML, else Markdown (host decides)</text>
  <text class="lg g3" x="66" y="407" font-family="Menlo, Consolas, monospace" font-size="13" fill="#fbbf24">you reply in one line: 1 yes 2 no 3: B</text>
  <text class="lg g4" x="66" y="428" font-family="Menlo, Consolas, monospace" font-size="13" fill="#34d399">do-it answer parses it into answers.json (source: reply)</text>
  <text class="lg g5" x="66" y="449" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">ratified: the build starts from the recorded answers</text>
  <rect x="790" y="298" width="360" height="46" rx="10" fill="#0a1626" stroke="#1e2d44"/>
  <text x="804" y="326" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">state.json status</text>
  <text class="st0" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">PLANNING</text>
  <text class="st1" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#fbbf24" opacity="0">AWAIT_RATIFY</text>
  <text class="st2" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">BUILDING</text>
  <text class="st3" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">VERIFYING</text>
  <text class="st4" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#e8eefc" opacity="0">CONCLUDING</text>
  <text class="st5" x="1136" y="327" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#34d399">DONE</text>
  <text x="790" y="368" font-family="Menlo, Consolas, monospace" font-size="12" fill="#5b6b85">token-meter.jsonl (one row per event)</text>
  <rect x="790" y="378" width="360" height="12" rx="6" fill="#10203a" stroke="#1e2d44"/>
  <rect class="mt" x="790" y="378" width="360" height="12" rx="6" fill="#38bdf8" style="transform-box:fill-box;transform-origin:left center"/>
  <text x="790" y="408" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5b6b85">flat while it waits for you: no model is running</text>
  <g class="ex0" opacity="0"><rect x="790" y="422" width="281.5" height="28" rx="14" fill="#0b1a2e" stroke="#fbbf24"/><text x="930.75" y="441" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#fbbf24">waiting for you, not burning tokens</text></g>
  <text x="50" y="486" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5b6b85">slices that do not depend on your answer keep moving meanwhile; an unanswered question falls back to its recorded default</text>
  </svg>
