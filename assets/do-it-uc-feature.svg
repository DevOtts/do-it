  <rect x="50" y="298" width="710" height="166" rx="10" fill="#0a1626" stroke="#1e2d44"/>
  <text x="66" y="318" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5b6b85">what happens, in order</text>
  <text class="lg g0" x="66" y="344" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7dd3fc">&gt; "add slugify to the utils, tests must pass"</text>
  <text class="lg g1" x="66" y="365" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">planner T1 writes the plan; every decision resolved or defaulted</text>
  <text class="lg g2" x="66" y="386" font-family="Menlo, Consolas, monospace" font-size="13" fill="#fbbf24">ratify: you approve the plan and its recorded defaults</text>
  <text class="lg g3" x="66" y="407" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">builder T2 builds; its last act is an it-result/1 file</text>
  <text class="lg g4" x="66" y="428" font-family="Menlo, Consolas, monospace" font-size="13" fill="#e8eefc">spine record: DOD-1..DOD-4 VERIFIED, evidence/DOD-n.log</text>
  <text class="lg g5" x="66" y="449" font-family="Menlo, Consolas, monospace" font-size="13" fill="#34d399">stop-gate: 4 of 4 rows terminal, so the run may end</text>
