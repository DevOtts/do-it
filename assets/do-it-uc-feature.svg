<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-labelledby="t d">
  <title id="t">Use case: a small feature, overnight</title>
  <desc id="d">An animation of one message travelling through intake, plan, the ratify gate, a build slice, verify and conclude. Plain files appear as it goes: state.json, events.jsonl, token-meter.jsonl, it-result/1 result files and the ledger. Four definition-of-done rows flip from OPEN to VERIFIED and the stop-gate lets the run end with 4 of 4 rows terminal. The status in state.json moves from INTAKE to DONE.</desc>
